<!doctype html>

<head>

<title>Ezekiel&#x27;s Child Dedication &amp; 1st Birthday</title>
<style>
:root{--blue:#0b6f99;--pale:#dff5ff;--cream:#fffdf8;--brown:#a98461;--ink:#24566c}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#dff5ff,#f9fdff);font-family:Arial,sans-serif;color:var(--ink)}
.wrap{max-width:620px;margin:auto;padding:14px}
.card{background:rgba(255,255,255,.94);border:1px solid #b9deeb;border-radius:28px;overflow:hidden;box-shadow:0 10px 35px rgba(35,104,130,.12)}
.top{padding:24px 18px 12px;text-align:center;background:linear-gradient(145deg,#c9edfb,#fafdff)}
.kicker{font-size:13px;letter-spacing:2px;font-weight:700;color:var(--blue)}
.name{font-family:cursive;font-size:clamp(44px,13vw,70px);line-height:1;color:var(--blue);margin:7px 0}
.subtitle{font-family:Georgia,serif;font-size:clamp(24px,7vw,34px);font-weight:700;color:var(--blue)}
.verse{margin:16px auto 8px;max-width:520px;font-family:Georgia,serif;font-style:italic;line-height:1.5;font-size:15px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;background:#edfaff}
.gallery img{width:100%;aspect-ratio:0.84;object-fit:cover;border-radius:16px;border:4px solid white;box-shadow:0 5px 14px rgba(0,0,0,.12)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:12px}
.nav button{min-height:48px;border:1px solid #a9d5e5;background:#fff;border-radius:14px;color:var(--blue);font-weight:700;font-size:12px;padding:7px 4px}
.nav button.active{background:var(--blue);color:#fff}
.panel{padding:8px 16px 22px}
.section{background:#f6fcff;border:1px solid #d4eaf2;border-radius:18px;padding:16px}
.row{padding:11px 0;border-bottom:1px solid #dcecf2;line-height:1.45}
.row:last-child{border-bottom:0}
.big{font-size:22px;font-weight:800;color:var(--blue)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.action{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;text-decoration:none;font-weight:800;border:1px solid #8fc5d9;background:#fff;color:var(--blue)}
.action.primary{background:var(--blue);color:#fff}
.note{text-align:center;font-family:Georgia,serif;font-style:italic;line-height:1.55;margin-top:14px}
.footer{padding:0 18px 24px;text-align:center;font-family:cursive;font-size:28px;color:var(--blue)}
@media(max-width:390px){.nav{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr}}
</style>
</head>

    ].join("\r\n");

    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="Ezekiel-1st-Birthday.ics";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  });
}
tabs.forEach(b=>b.addEventListener("click",()=>show(b.dataset.tab)));
show("details");
</script>
